spring.application.name=Backend

# ================================
# SERVER - RENDER
# ================================
server.port=${PORT:8080}
server.ssl.enabled=false

# ================================
# FRONTEND / CORS
# ================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173}

# ================================
# GOOGLE OAUTH2
# ================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}

# ================================
# MULTIPART
# ================================
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

# ================================
# SUPABASE POSTGRESQL
# ================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ================================
# SUPABASE STORAGE
# ================================
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

# ================================
# MAIL
# ================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================================
# IA SERVICE
# ================================
ia.service.url=${IA_SERVICE_URL:https://decklybuy-ia.onrender.com}

# ================================
# MERCADO PAGO
# ================================
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}

# ================================
# OLLAMA LOCAL / CHAT IA
# ================================
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:phi3}

# ================================
# SESSION COOKIE
# ================================
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=7d

# ================================
# LOGS
# ================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO